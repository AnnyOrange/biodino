MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  WEIGHTS: ''
  DTYPE: float32
compute_precision:
  param_dtype: bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP
  # ``fsdp`` is the upstream default. ``ddp`` keeps a full replica per device
  # when the model fits, avoiding all-gather and reshard traffic.
  distributed_mode: fsdp
dino:
  loss_weight: 1.0
  global_ignore_diagonal: true  # Whether to ignore A-A and B-B global pairs, default as in DINOv2, ignored by SSLMetaArch
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1
  koleo_loss_distributed: false
  koleo_topk: 1
  koleo_distributed_replicas: 0
  koleo_distributed_loss_group_size: null  # Size of the nearest neighbor set for distributed Koleo. If None, uses global batch size.
  koleo_distributed_loss_group_data: true # group data from adjacent ranks to make sure koleo is applied on the same data distribution
  force_weight_norm: false
  reweight_dino_local_loss: false # If true, reweighting of DINO loss
  local_loss_weight_schedule:  # Schedule for local loss weight, enabled if reweight_dino_local_loss is true
    start: 0.5
    peak: 0.5
    end: 0.5
    warmup_epochs: 0
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  mask_random_circular_shift: false
  force_masking_even_with_zero_weight: False
  separate_head: true
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
sigreg:
  # FINO regularization on the unnormalized student DINO-head bottleneck.
  enabled: false
  mode: bottleneck
  loss_weight: 0.05
  num_slices: 1024
  range_max: 5.0
  n_knots: 17
  koleo_too: false
  weight_schedule:
    enabled: false
    type: cosine  # cosine or step
    start_update: 0
    end_update: -1  # -1 uses the final optimizer update
    final_weight: 0.0
channel_subset:
  # Let the EMA teacher see every available channel while the student sees a
  # random subset. This is task-label-free and is disabled for standard runs.
  enabled: false
  min_channels: 1
  max_channels: 3
nested_channel_innovation:
  # Keep the main SSL objective full-channel symmetric. An auxiliary subset
  # pass estimates the subset-predictable component with detached regression;
  # only the residual innovation losses update the full-channel backbone.
  enabled: false
  # The conditional residual is defined only when F and S are encoded from
  # the same observation. ``masked_shared`` uses the main iBOT observation
  # on both channel views. ``unmasked_shared`` remains a valid ablation, and
  # ``legacy_mask_mismatch`` is retained solely to reproduce older screens.
  observation_protocol: masked_shared # unmasked_shared | masked_shared | legacy_mask_mismatch
  min_channels: 1
  max_channels: 3
  loss_weight: 0.1
  predictor_hidden_dim: 0  # 0 selects 2 * backbone embed_dim
  predictor_lr_multiplier: 10.0
  stop_gradient: true
  # Recompute only the differentiable subset branch in the no-firewall
  # ablation. This preserves its objective while avoiding an FSDP-only test.
  checkpoint_subset_forward: false
  checkpoint_full_forward: false
  predictor_loss_weight: 1.0
  invariance_loss_weight: 1.0
  variance_loss_weight: 1.0
  orthogonality_loss_weight: 1.0
  min_std: 0.1
  # A second conditional step S subset M subset F turns the residual into
  # adjacent martingale differences rather than one undifferentiated F|S gap.
  martingale_enabled: false
  martingale_lower_loss_weight: 1.0
  martingale_cross_orthogonality_weight: 1.0
  martingale_checkpoint_middle_forward: true
conditional_morphology_graph:
  # Use an EMA teacher's local patch graph only on edges that cannot be
  # predicted from a strict channel subset. This preserves extra-channel
  # morphology without applying a global Gram anchor.
  enabled: false
  min_channels: 1
  max_channels: 1
  loss_weight: 1.0
  predictor_hidden_dim: 0
  predictor_lr_multiplier: 10.0
  stop_gradient: true
  # Use the EMA teacher for both C and S when estimating conditional
  # innovation, so the gate represents a stable teacher-space quantity rather
  # than the student's rapidly moving representation.
  condition_source: teacher  # teacher or student
  # ``feature`` retains the original token-prediction route. ``edge`` is the
  # direct conditional graph predictor: it estimates E[G_C | T(S)] in the
  # same space in which innovation is later selected.
  predictor_mode: feature  # feature or edge
  edge_predictor_dim: 64
  predictor_loss_weight: 1.0
  graph_loss_weight: 1.0
  local_radius: 2
  min_innovation: 0.0
  # Keep only this fraction of valid local edges per image. A value below one
  # creates a density-matched test of whether irreducible channel information
  # is more useful than an equally sparse content-independent edge set.
  selection_fraction: 1.0
  max_edge_weight: 4.0
  huber_beta: 0.05
  gate_mode: conditional  # conditional or uniform (density-matched control)
nested_resolution_innovation:
  # Decompose a full-resolution representation into the component predictable
  # from a nested low-pass view and a non-collapsed scale-specific innovation.
  enabled: false
  downsample_factor: 2
  feature_mode: cls_patch_mean  # cls or cls_patch_mean
  loss_weight: 0.1
  predictor_hidden_dim: 0
  predictor_lr_multiplier: 10.0
  stop_gradient: true
  predictor_loss_weight: 1.0
  invariance_loss_weight: 1.0
  variance_loss_weight: 1.0
  orthogonality_loss_weight: 1.0
  min_std: 0.25
acquisition_orbit_deflation:
  # Restrict only the newly learned displacement that lies along a frozen
  # acquisition nuisance orbit, not the whole pretrained representation.
  enabled: false
  # gradient_projection is forward-identical and projects only the backward
  # CLS gradient. random_gradient_projection is its rank-matched control.
  mode: deflate  # deflate | random_tangent | direct_consistency | gradient_projection | random_gradient_projection
  loss_weight: 0.1
  projection_strength: 1.0
  projection_scope: cls  # cls | cls_patch
  num_perturbations: 3
  contrast_scale: 1.15
  background_scale: 0.10
  blur_mix: 0.50
  min_singular_value: 1.0e-4
  relative_singular_value: 0.05
scout_kernel_transport:
  # Transfer only a smaller model's pretraining-relative relation change.
  enabled: false
  loss_weight: 0.1
  # ``anchor_consistent`` uses a shared unmasked view. ``mask_matched`` uses
  # the ordinary iBOT student representation but gives the frozen anchors the
  # exact same mask. ``masked_student`` is retained only to reproduce early
  # diagnostics; it mixes a masked student with an unmasked anchor.
  current_feature_protocol: masked_student # masked_student | anchor_consistent | mask_matched
  # Kernel displacement starts at zero under the anchor-consistent protocol.
  # This trust-region scale bounds the directional gradient at that point;
  # it is in Frobenius units of the centered batch kernel displacement.
  directional_damping: 0.1
  # A positive ratio caps Scout transport outside a local ball around the
  # large-model anchor. It is normalized by the frozen Scout target norm;
  # zero preserves ordinary transport throughout adaptation.
  displacement_budget_ratio: 0.0
  # ``stable_delta`` keeps only cross-view reproducible components of the
  # anchor-relative scout displacement. ``shuffled_stable_delta`` preserves
  # that target's norm/spectrum but breaks sample correspondence as a control.
  target_mode: delta # delta | stable_delta | shuffled_delta | shuffled_stable_delta | final_kernel
  stable_relative_eigenvalue: 0.05
  stable_min_eigenvalue: 1.0e-6
  scout_config_path: null
  scout_anchor_checkpoint: null
  scout_adapted_checkpoint: null
gram:
  use_loss: false # (bool) if true gram is used, else not
  compute_stats: false # (bool): if true compute auxilliary stats
  loss_weight: 1.0 # (float): weight of the loss
  ema_teacher: false # (bool): using the EMA teacher as GRAM teacher
  ckpt: null  #(str): Checkpoint to the teacher
  it_load_ema_teacher: -1 # (int): iteration at which the ema teacher is loaded into the gram teacher
  rep_update: true # (bool): if true GRAM teacher updated every gram.update_frequency after iter gram.it_first_update steps
  update_frequency: 50000 # (int): update frequency
  it_first_update: 0 # (int): iteration of the first update
  max_updates: null # (int): maximum number of updates to gram teacher. If None, it is unlimited
  normalized: true # (bool): normalization of the features
  img_level: false # (bool): if true GRAM computation at the image else, otherwise at the local batch level
  remove_neg: false # (bool): if true remove the negative similarities before applying the loss
  remove_only_teacher_neg: false # (bool): remove negative similarities of the teacher
  tokens_used: all # (str): In [all, masked, unmasked]
  global_teacher_resize_method: bicubic  # Method for resizing the outputs of the gram teacher
  global_teacher_resize_antialias: false  # Whether to use antialiasing when resizing the outputs of the gram teacher
  loss_weight_schedule: null  # (dict): If not None, use a schedule for the loss weight instead of `loss_weight`
train:
  batch_size_per_gpu: 64
  dataset_path: ImageNet:split=TRAIN
  data_config: null
  output_dir: .
  saveckp_freq: 20
  seed: 0
  num_workers: 10
  # Enable only for controlled method comparisons. This fixes WDS shard/sample
  # order and isolates augmentation/masking RNG from model-side randomness.
  wds_deterministic_resampling: false
  OFFICIAL_EPOCH_LENGTH: 1250
  monitor_gradient_norm: false
  chunk_schedule: []
  use_teacher_head: true
  learn_from_teacher_tokens: false
  centering: "sinkhorn_knopp" # or "sinkhorn_knopp"
  checkpointing: false
  checkpointing_full: false  # aggressive checkpointing
  compile: true
  cudagraphs: false
  sharded_eval_checkpoint: false
  cache_dataset: false
student:
  arch: vit_large
  patch_size: 16
  drop_path_rate: 0.3
  layerscale: 1.0e-05
  pretrained_weights: ''
  ffn_layer: "mlp"
  ffn_ratio: 4.0
  resume_from_teacher_chkpt: ""
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: "layernorm"
  n_storage_tokens: 0
  mask_k_bias: false
  untie_cls_and_patch_norms: false  # If true, use separate norms for CLS/reg and patch/mask tokens
  untie_global_and_local_cls_norm: false  # If true, use separate norms for local and global crop CLS token during training
  in_chans: 3
  enable_channelvit: false
  stem_type: null  # null/"auto" = standard PatchEmbed or enable_channelvit; "dualroute" = hard RGB/pool switch; "residual_mc" = RGB base + ch4+ residual; "residual_mc_v2" = repeat low-channel RGB fill + residual
  residual_mc_extra_scale_init: 0.001
  pos_embed_type: rope
  pos_embed_rope_base: 100.0
  pos_embed_rope_min_period: null
  pos_embed_rope_max_period: null
  pos_embed_rope_normalize_coords: separate  # min, max, separate
  pos_embed_rope_shift_coords: null
  pos_embed_rope_jitter_coords: null
  pos_embed_rope_rescale_coords: null
  pos_embed_rope_dtype: bf16
  fp8_enabled: False  # Convert Linear layers to operate in fp8 precision
  fp8_filter: "blocks"  # Regex that must appear in module path; empty means everything
teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 30
  in_chans: 3
  enable_channelvit: false
  stem_type: null
  residual_mc_extra_scale_init: 0.001
distillation:  # teacher
  enabled: false
  full_cfg_path: ""
  checkpoint_path: ""
multidistillation:
  enabled: false
hrft:  # non-hrft'd student
  enabled: false
  checkpoint_path: ""  # teacher_checkpoint path
optim:
  epochs: 100
  optimizer: adamw
  weight_decay: 0.04
  weight_decay_end: 0.4
  lr: 0.001
  warmup_epochs: 10
  min_lr: 1.0e-06
  schedule_trunc_extra: 0.0  # Compute the schedule for (1 + schedule_trunc_extra) steps and truncate, .25 is a good choice
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  # Keep the trunk fixed for an initial heads-only warmup, measured in optimizer updates.
  freeze_backbone_updates: 0
  # -1 trains the full backbone. A positive value freezes the embedding/trunk
  # except for the last N transformer blocks and final normalization layers.
  trainable_last_blocks: -1
  # Partial-backbone multi-channel runs can train only the new residual branch
  # while preserving the official RGB PatchEmbed exactly.
  trainable_extra_stem: false
  scaling_rule: sqrt_wrt_1024
  gradient_accumulation_steps: 1
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.9
  multi_tensor_optim: true
  dump_fsdp_weights_path: ""
  adamw_beta1: 0.9
  adamw_beta2: 0.999
crops:
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_number: 8
  local_crops_scale:
  - 0.05
  - 0.32
  global_crops_size: 224
  local_crops_size: 96
  global_local_crop_pairs_ratios: 1.0
  gram_teacher_crops_size: null  # If not None, return crops for gram teacher
  localcrops_subset_of_globalcrops: false
  share_color_jitter: false
  # Reuse the global crop geometry for both global views.  Disabled for normal
  # pretraining; useful for controlled representation diagnostics.
  paired_global_geometry: false
  horizontal_flips: true
  augmentation_policy: dinov3  # dinov3 or bio_safe
  gram_teacher_no_distortions: false  # If True, no distortions are applied to gram teacher crops
  float_input: false  # Set true when decoders already output float32 [0,1] tensors
  rgb_mean:
  - 0.485
  - 0.456
  - 0.406
  rgb_std:
  - 0.229
  - 0.224
  - 0.225
evaluation:
  eval_period_iterations: 12500
  low_freq_every: 5
  config_files:  # Must be in fairvit/eval/configs
    high_freq: benchmark_high_frequency.yaml  # More often
    low_freq: benchmark_low_frequency.yaml  # Less often
checkpointing:
  period: 3750
  max_to_keep: 3
  keep_every: 99999999999999999  # Save a checkpoint every N iterations, regardless of max_to_keep and period
  sharded: false

# Example of constant schedules with schedules v2
# # schedules:
# #   lr:
# #     start: 0.0
# #     peak: 1e-3
# #     end: 1e-6
# #     warmup_epochs: 10
# #     freeze_last_layer_epochs: 1
# #   weight_decay:
# #     start: 0.04
# #     peak: 0.04
