# #5: ViT-L robust + 高分辨率(512) + Gram anchoring 的 phase-2 短训练。
# 从 #4 robust-L 的近终态快照(iter 14349)续训:
#   - student 用它初始化(resume_from_teacher_chkpt)
#   - Gram teacher 也用它(gram.ckpt,冻结) → 锚定"已 microscopy-adapted 的健康 dense",
#     而不是 base DINOv3(那会拿自然图 dense 去对抗 microscopy 适配)。
# 数据/归一化继承 #4(packwds_robust + robust rgb_mean/std)。8 卡。
# 目标:打 dense headroom(monuseg/pannuke 的 AJI/bPQ)。

train:
  dataset_path: "packwds_robust:/mnt/huawei_deepcad/webds_micro_100k_by_channel_patched_shuffle/filtered_mixed_train_w*-{000000..000999}.tar::pct=1,99"
  batch_size_per_gpu: 4          # 512 很重 + 还要跑 Gram teacher forward,先保守防 OOM(显存健康可升到 6~8)
  num_workers: 10
  OFFICIAL_EPOCH_LENGTH: 1025
  output_dir: ./outputs/bio_continue_vitl16_robust_hires_gram
  compile: false

student:
  arch: vit_large
  patch_size: 16
  ffn_layer: mlp
  ffn_ratio: 4.0
  drop_path_rate: 0.25
  in_chans: 3
  enable_channelvit: false
  n_storage_tokens: 4
  mask_k_bias: true
  # 从 #4 robust-L 近终态快照续训(已确认 {"teacher":...} 格式可被 init_fsdp 加载)
  resume_from_teacher_chkpt: "/mnt/huawei_deepcad/dinov3/outputs/bio_continue_vitl16_robust/eval/training_14349/teacher_checkpoint.pth"

teacher:
  in_chans: 3
  enable_channelvit: false
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 30

optim:
  epochs: 3                      # 高分辨率短适配阶段(不是全程)
  optimizer: adamw
  lr: 2.0e-5                     # 低 LR(在已收敛模型上微调)
  min_lr: 1.0e-6
  warmup_epochs: 1
  weight_decay: 0.04
  weight_decay_end: 0.2
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: fixed
  gradient_accumulation_steps: 8 # 8卡 × 4 × 8 = global 256(高分辨率阶段不必 1024)

crops:
  global_crops_size: 512         # ★ student 高分辨率
  local_crops_size: 96
  gram_teacher_crops_size: 512   # ★ ckpt-teacher 模式必须设;先 = student 分辨率
  gram_teacher_no_distortions: true   # Gram teacher 看干净 crop,锚点稳
  # robust per-channel [0,1] 归一化的统计(继承 #4)
  rgb_mean:
    - 0.514666
    - 0.488834
    - 0.498267
  rgb_std:
    - 0.338707
    - 0.339202
    - 0.336091

gram:
  use_loss: true                 # ★ 开 Gram anchoring
  compute_stats: false
  loss_weight: 1.0               # ★ 主要待调旋钮
  ema_teacher: false             # 用独立 ckpt teacher(冻结)
  ckpt: "/mnt/huawei_deepcad/dinov3/outputs/bio_continue_vitl16_robust/eval/training_14349/teacher_checkpoint.pth"
  it_load_ema_teacher: -1        # ckpt 已提供,保持 -1
  rep_update: false              # 冻结锚点(最简)
  tokens_used: all
  normalized: true
  global_teacher_resize_method: bicubic
  global_teacher_resize_antialias: false

evaluation:
  eval_period_iterations: 0      # 训练中不评测(短 run,最后单独评 final ckpt)

checkpointing:
  period: 1025
  max_to_keep: 5
