# ViT-H+/16 RGB continual pretraining. Dataset, initialization, output path,
# batch size, LR, and schedule are supplied by the scaling launcher.

train:
  dataset_path: null
  batch_size_per_gpu: 32
  num_workers: 10
  OFFICIAL_EPOCH_LENGTH: 1025
  output_dir: .
  cache_dataset: false
  compile: false

student:
  arch: vit_huge2
  patch_size: 16
  ffn_layer: swiglu
  ffn_ratio: 6.0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernormbf16
  layerscale: 1.0e-5
  pos_embed_rope_rescale_coords: 2
  pos_embed_rope_dtype: fp32
  drop_path_rate: 0.2
  in_chans: 3
  enable_channelvit: false
  stem_type: null
  n_storage_tokens: 4
  mask_k_bias: true
  resume_from_teacher_chkpt: ""

teacher:
  in_chans: 3
  enable_channelvit: false
  stem_type: null
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 5

optim:
  epochs: 15
  optimizer: adamw
  lr: 5.0e-5
  min_lr: 1.0e-6
  warmup_epochs: 2
  weight_decay: 0.04
  weight_decay_end: 0.2
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: fixed
  gradient_accumulation_steps: 4
  patch_embed_lr_mult: 0.2
  layerwise_decay: 0.9

crops:
  global_crops_size: 256
  local_crops_size: 112
  horizontal_flips: true
  augmentation_policy: bio_safe
  float_input: true
  rgb_mean:
    - 0.514666
    - 0.488834
    - 0.498267
  rgb_std:
    - 0.338707
    - 0.339202
    - 0.336091

evaluation:
  eval_period_iterations: 0

checkpointing:
  period: 1025
  max_to_keep: 30

gram:
  use_loss: false
  compute_stats: false
