# ViT-S+/16 official-arch continuation for the microscopy packed WebDataset.
# Effective global batch 1024 on 8 GPUs:
#   default 128/GPU x 8 x accum 1; if OOM use 64/GPU x 8 x accum 2.
# OFFICIAL_EPOCH_LENGTH follows the existing S+ baseline setting.

train:
  dataset_path: "packwds:/mnt/huawei_deepcad/webds_micro_100k_by_channel_patched_shuffle/filtered_mixed_train_w*-{000000..000999}.tar"
  batch_size_per_gpu: 64
  num_workers: 2
  OFFICIAL_EPOCH_LENGTH: 1025
  output_dir: ./outputs/bio_chinchilla_vitsplus16_1tb_b1024
  compile: false
  wds_shuffle_buffer: 50
  prefetch_factor: 1
  pin_memory: false

student:
  arch: vit_small
  patch_size: 16
  ffn_layer: swiglu
  ffn_ratio: 6.0
  drop_path_rate: 0.15
  norm_layer: layernormbf16
  in_chans: 3
  enable_channelvit: false
  n_storage_tokens: 4
  mask_k_bias: true
  pos_embed_rope_rescale_coords: 2
  pos_embed_rope_dtype: fp32
  resume_from_teacher_chkpt: "/mnt/huawei_deepcad/weights/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth"

teacher:
  in_chans: 3
  enable_channelvit: false
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 5

optim:
  epochs: 30
  optimizer: adamw
  lr: 1.5e-4
  min_lr: 1.0e-6
  warmup_epochs: 2
  weight_decay: 0.04
  weight_decay_end: 0.2
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: fixed
  gradient_accumulation_steps: 2
  lr_reference_effective_batch_size: 1024
  expected_effective_batch_size: 1024
  batch_lr_mismatch_policy: warn

crops:
  # Only switches non-crop augmentations; crop scales/counts stay inherited
  # from ssl_default_config unless explicitly overridden elsewhere.
  augmentation_policy: bio_safe
  # Match the original DINOv3 pretrain crop sizes; independent of augmentation_policy.
  global_crops_size: 256
  local_crops_size: 112
  rgb_mean:
    - 0.511375
    - 0.598449
    - 0.683452
  rgb_std:
    - 0.340017
    - 0.306132
    - 0.284308

evaluation:
  eval_period_iterations: 0

checkpointing:
  period: 1025
  max_to_keep: 50
