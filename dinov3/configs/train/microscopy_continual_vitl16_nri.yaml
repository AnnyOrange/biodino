# ViT-L NRI on the H-line RGB recipe.
#
# NRI downsamples the same RGB crop (2x low-pass, restore FOV) and learns the
# residual that a low-resolution view cannot predict. It does not need extra
# channels. Do not copy Residual-MC / ChannelViT from the NCI yaml; that is a
# different input carrier and would confound the NRI test.
#
# Eight GPUs: 16/GPU x accum 8 = global batch 1024. Four GPUs must raise
# accum to 16 to keep the same global batch. Do not train a fresh RGB
# control; score against historical H-S0 L ck 15374.

compute_precision:
  distributed_mode: ddp

train:
  dataset_path: "packwds:/mnt/huawei_deepcad/webds_micro_100k_by_channel_patched_shuffle/filtered_mixed_train_w*-{000000..000999}.tar"
  batch_size_per_gpu: 16
  num_workers: 2
  OFFICIAL_EPOCH_LENGTH: 1025
  output_dir: ./outputs/01_training_runs/nri_vitl_hs0_rgb
  compile: false
  checkpointing: false
  wds_shuffle_buffer: 100
  prefetch_factor: 1
  pin_memory: false

student:
  arch: vit_large
  patch_size: 16
  ffn_layer: mlp
  ffn_ratio: 4.0
  drop_path_rate: 0.25
  in_chans: 3
  enable_channelvit: false
  stem_type: null
  n_storage_tokens: 4
  mask_k_bias: true
  resume_from_teacher_chkpt: "/mnt/huawei_deepcad/weights/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"

teacher:
  in_chans: 3
  enable_channelvit: false
  stem_type: null
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 30

sigreg:
  enabled: false

channel_subset:
  enabled: false

nested_channel_innovation:
  enabled: false

nested_resolution_innovation:
  enabled: true
  downsample_factor: 2
  feature_mode: cls_patch_mean
  loss_weight: 0.1
  predictor_hidden_dim: 0
  predictor_lr_multiplier: 10.0
  stop_gradient: true
  predictor_loss_weight: 1.0
  invariance_loss_weight: 1.0
  variance_loss_weight: 1.0
  orthogonality_loss_weight: 1.0
  min_std: 0.25

optim:
  epochs: 15
  optimizer: adamw
  lr: 1.0e-4
  min_lr: 1.0e-6
  warmup_epochs: 3
  weight_decay: 0.04
  weight_decay_end: 0.2
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: fixed
  gradient_accumulation_steps: 8

crops:
  augmentation_policy: dinov3
  float_input: false
  global_crops_size: 224
  local_crops_size: 96
  rgb_mean: [0.511375, 0.598449, 0.683452]
  rgb_std: [0.340017, 0.306132, 0.284308]

evaluation:
  eval_period_iterations: 0

checkpointing:
  period: 1025
  max_to_keep: 2
  sharded: false
